<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Critical Low Stock Items</title>

<style>
body {
    font-family: "Segoe UI";
    background: #ECF0F1;
    padding: 25px;
    position: relative;
}

/* WATERMARK */
body::after {
    content: "";
    background: url('/static/ibukunolu logo.jpeg') no-repeat center;
    background-size: 350px;
    opacity: 0.08;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: -1;
}

/* FIXED TABLE HEADER */
.table-container {
    max-height: 600px;
    overflow-y: auto;
    border-radius: 8px;
    background: white;
}

table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
}

thead th {
    background: #2C3E50;
    color: white;
    padding: 10px;
    position: sticky;
    top: 0;
    z-index: 10;
}

td {
    padding: 10px;
    border-bottom: 1px solid #ccc;
}

.low {
    background: #ffdddd;
}

button, input, select {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    margin-right: 10px;
    margin-top: 15px;
}

button {
    background: #2C3E50;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1ABC9C;
}

.search-box {
    margin-bottom: 20px;
}
</style>
</head>

<body>

<h2>Critical Low Stock (Qty < 20)</h2>

<!-- SEARCH + SORT -->
<div class="search-box">
    <form method="GET" action="/stock/low">
        <input type="text" name="search" placeholder="Search drug..." value="{{ search }}">

        <select name="sort">
            <option value="quantity_remaining" {% if sort=='quantity_remaining' %}selected{% endif %}>Sort by Qty</option>
            <option value="drug_name" {% if sort=='drug_name' %}selected{% endif %}>Sort by Drug</option>
            <option value="categories" {% if sort=='categories' %}selected{% endif %}>Sort by Category</option>
            <option value="date" {% if sort=='date' %}selected{% endif %}>Sort by Date</option>
        </select>

        <button type="submit">Apply</button>
    </form>
</div>

<!-- DATE FILTER -->
<form method="POST" action="/stock/low">
    <label><strong>From</strong></label>
    <input type="date" name="start_date" required>

    <label><strong>To</strong></label>
    <input type="date" name="end_date" required>

    <button type="submit">Filter by Date</button>
</form>

{% if rows %}
<div class="table-container">
<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Drug Name</th>
            <th>Category</th>
            <th>Qty Remaining</th>
            <th>Sales Price</th>
        </tr>
    </thead>

    <tbody>
    {% for r in rows %}
        <tr class="low">
            <td>{{ r["date"] }}</td>
            <td>{{ r["drug_name"] }}</td>
            <td>{{ r["categories"] }}</td>
            <td>{{ r["quantity_remaining"] }}</td>
            <td>{{ r["sales_price"] }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
</div>
{% else %}
<h3>No critical low stock items found.</h3>
{% endif %}

<button onclick="window.location.href='/dashboard'">Back to Dashboard</button>

</body>
</html>
