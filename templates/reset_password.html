<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/style.css">
    <title>Password Reset</title>
    <style>
        body { font-family:'Segoe UI'; background:#eef1f5; margin:0; padding-top:80px; }
        .header { background:#003366; color:white; padding:15px; position:fixed; top:0; width:100%; }
        .container { width:800px; margin:auto; padding:20px; }
        .card { background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px #ccc; }
        select, input { width:100%; padding:10px; margin:8px 0; border-radius:6px; border:1px solid #ccc; }
        button { padding:10px 16px; border:none; border-radius:6px; background:#003366; color:white; cursor:pointer; }
        button:hover { background:#00509e; }
        .success { color:green; margin-bottom:10px; font-weight:600; }
        .footer {
            position:fixed; bottom:0; left:0; width:100%;
            background:rgba(0,0,0,0.65); color:white;
            text-align:center; padding:8px; font-size:14px;
        }
    </style>
</head>
<body>

<div class="header">
    Logged in as: {{ user }} ({{ role }})
</div>

<div class="container">
    <h2>Password Reset</h2>

    <div class="card">
        {% if success %}
            <div class="success">{{ success }}</div>
        {% endif %}

        <form method="POST">
            <label>Select User</label>
            <select name="username" required>
                <option value="">-- Choose User --</option>
                {% for u in users %}
                    <option value="{{ u.username }}">{{ u.username }} ({{ u.role }})</option>
                {% endfor %}
            </select>

            <label>New Password</label>
            <input type="text" name="new_password" required>

            <button type="submit">Reset Password</button>
        </form>
    </div>
</div>

<div class="footer">
    Powered by Ibukun-Olu ICT Unit
</div>

</body>
</html>
